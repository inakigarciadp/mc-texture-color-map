<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Block color map</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { --z-close: #ffb02e; --z-neutral: #f4f4f0; --z-accent: #2ee6f0; --z-src: #ff3b30; }
button { font: inherit; color: inherit; }
#wrap { overflow: auto; display: grid; place-items: center; }
#map { position: relative; touch-action: manipulation; --b: 1px; --m: 6px; }
#map div { position: absolute; left: 0; top: 0; background-size: 100% 100%; image-rendering: pixelated;
           transition: transform .5s cubic-bezier(.3,.7,.2,1), opacity .25s, filter .25s; cursor: pointer; }
#map div:hover { z-index: 2; }
#map.matching div { opacity: .12; filter: grayscale(1); }
#map.matching div.on { opacity: 1; filter: none; }
#map div.z-close::after, #map div.z-neutral::after, #map div.z-accent::after {
  content: ""; position: absolute; left: 0; top: 0; width: var(--m); height: var(--m);
  clip-path: polygon(0 0, 100% 0, 0 100%); opacity: .9; }
#map div.z-close::after { background: var(--z-close); }
#map div.z-neutral::after { background: var(--z-neutral); }
#map div.z-accent::after { background: var(--z-accent); }
#map div.z-src { box-shadow: inset 0 0 0 var(--b) var(--z-src); z-index: 1; }
#tip { position: fixed; z-index: 20; pointer-events: none; display: none; }
#tip.pinned { pointer-events: auto; }
#tip .match { display: none; }
#tip.pinned .match { display: inline-flex; }
#chip { display: none; }
body.matching #chip { display: flex; }
.sw, .src { background-size: 100% 100%; image-rendering: pixelated; flex: none; }
[data-z] { --c: var(--z-close); }
[data-z=neutral] { --c: var(--z-neutral); }
[data-z=accent] { --c: var(--z-accent); }
button:disabled { opacity: .35; cursor: default !important; }
body { display: flex; background: #858582; color: #1f2024; font: 13px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
#side { flex: none; width: 272px; background: #fafaf8; border-right: 1px solid #0002; display: flex; flex-direction: column; overflow: auto; }
.top { padding: 20px 20px 6px; }
.top h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 9px; }
.logo { width: 20px; height: 20px; border-radius: 5px; background: conic-gradient(#e5484d, #f5a623, #f5d90a, #46a758, #0090ff, #8e4ec6, #e5484d); }
.top p { margin: 4px 0 0; color: #868893; font-size: 12px; }
section { padding: 14px 20px; border-top: 1px solid #eeeeea; }
section:first-of-type { border-top: 0; }
h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; color: #868893; text-transform: uppercase; letter-spacing: .07em; }
#views { display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; background: #eeeeeb; border-radius: 9px; }
#views button { border: 0; background: none; padding: 6px 0; border-radius: 7px; cursor: pointer; color: #5d5f68; text-transform: capitalize; }
#views button.on { background: #fff; color: #1f2024; font-weight: 600; box-shadow: 0 1px 3px #0002; }
#layouts { display: flex; flex-direction: column; gap: 2px; }
#layouts button { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 8px; cursor: pointer; text-transform: capitalize; font-weight: 500; }
#layouts button::after { display: block; font-weight: 400; font-size: 11.5px; color: #868893; text-transform: none; margin-top: 1px; }
#layouts [data-v=reference]::after { content: "The original Reddit shape"; }
#layouts [data-v=wheel]::after { content: "Hue around, dark center to light rim"; }
#layouts [data-v=spectrum]::after { content: "Hue across, dark to light upward"; }
#layouts [data-v=rows]::after { content: "One band per color family"; }
#layouts [data-v=som]::after { content: "Similar blocks side by side"; }
#layouts button:hover { background: #f0f0ed; }
#layouts button.on { background: #1f2024; color: #fff; }
#layouts button.on::after { color: #fff9; }
.gaprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.gaplbl { cursor: pointer; display: flex; align-items: center; gap: 6px; }
.gapsec:has(#gaps:disabled) .gaplbl { opacity: .35; cursor: default; }
#gaps { flex: none; border: 0; background: none; padding: 2px 0; cursor: pointer; }
#gapsinfo { margin: 1px 0 0; color: #868893; font-size: 11.5px; padding-right: 44px; }
.info { display: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #c4c5cb; background: none; color: #868893;
  font: 600 11px/1 ui-serif, Georgia, serif; font-style: italic; cursor: pointer; padding: 0; place-items: center; }
.info[aria-expanded=true] { background: #1f2024; border-color: #1f2024; color: #fff; }
#gaps i { display: block; width: 34px; height: 20px; border-radius: 10px; background: #d9d9d4; position: relative; transition: background .2s; }
#gaps i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px #0003; transition: transform .2s; }
#gaps.on i { background: #30a46c; } #gaps.on i::after { transform: translateX(14px); }
#sel { margin-top: auto; }
#sel .empty { color: #a3a5ad; font-size: 12px; padding: 14px 0; text-align: center; border: 1.5px dashed #e2e2dd; border-radius: 10px; }
#sel .card { display: none; }
body.selecting #sel .empty { display: none; }
body.selecting #sel .card { display: grid; grid-template-columns: 56px 1fr; gap: 0 12px; align-items: center; }
#sel .sw { width: 56px; height: 56px; border-radius: 8px; grid-row: span 2; box-shadow: inset 0 0 0 1px #0001; }
#sel .name { font-weight: 600; font-size: 14px; text-transform: capitalize; align-self: end; }
#sel .hex { align-self: start; }
#sel .match { grid-column: span 2; }
#sel .hex { font: 12px ui-monospace, Menlo, monospace; color: #868893; margin-top: 2px; }
#sel .match, #tip .match { width: 100%; margin-top: 10px; border: 0; background: #1f2024; color: #fff; padding: 9px; border-radius: 8px; cursor: pointer; font-weight: 600; }
#sel .match:hover { background: #000; }
#chip { flex-direction: column; gap: 4px; }
#chip .head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
#chip .src { width: 36px; height: 36px; border-radius: 6px; box-shadow: 0 0 0 2px var(--z-src); }
#chip .src-name { font-weight: 600; text-transform: capitalize; flex: 1; }
#chip .x { border: 0; background: #eeeeeb; border-radius: 6px; padding: 5px 9px; cursor: pointer; font-size: 12px; color: #5d5f68; }
#chip .x:hover { background: #e2e2dd; color: #1f2024; }
#chip [data-z] { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 5px 6px; border-radius: 7px; cursor: pointer; text-align: left; color: #868893; }
#chip [data-z]:hover { background: #f0f0ed; }
#chip [data-z]::before { content: ""; flex: none; width: 16px; height: 16px; border-radius: 4px; background: var(--c); opacity: .3; box-shadow: inset 0 0 0 1px #0002; }
#chip [data-z].on { color: #1f2024; } #chip [data-z].on::before { opacity: 1; }
#chip [data-z] small { display: block; font-size: 11px; color: #a3a5ad; }
.matchsec { display: none; } body.matching .matchsec { display: block; }
#wrap { flex: 1; min-width: 0; padding: 24px; }
#map div.sel { outline: 2px solid #fff; outline-offset: 1px; box-shadow: 0 0 0 4px #0006; z-index: 3; }
#tip { background: #1f2024f2; color: #fff; padding: 6px 10px; border-radius: 7px; max-width: min(92vw, 320px); box-shadow: 0 6px 20px #0004; }
#tip .sw, #tip .hex { display: none; }
#tip .name { text-transform: capitalize; }
#tip .match { background: #fff; color: #1f2024; padding: 6px; margin-top: 6px; justify-content: center; }
@media (min-width: 761px) { #tip.pinned { display: none !important; } }
@media (max-width: 760px) {
  body { flex-direction: column; }
  #side { width: auto; border: 0; border-bottom: 1px solid #0002; overflow: visible; }
  .top { padding: 12px 14px 10px; } .top p { display: none; }
  /* one full-width row per control, both choices as the same segmented control */
  .ctrls { display: flex; flex-direction: column; gap: 8px; padding: 0 14px 10px; }
  section { padding: 0; border: 0; } h2 { display: none; }
  #layouts { flex-direction: row; gap: 0; padding: 3px; background: #eeeeeb; border-radius: 9px; }
  #layouts button { flex: 1 1 auto; padding: 6px 2px; text-align: center; border-radius: 7px; color: #5d5f68; font-weight: 400; }
  #layouts button::after { display: none; }
  #layouts button:hover { background: none; }
  #layouts button.on { background: #fff; color: #1f2024; font-weight: 600; box-shadow: 0 1px 3px #0002; }
  .info { display: grid; }
  /* the description is one tap away on phones */
  #gapsinfo { display: none; padding: 0; } #gapsinfo.open { display: block; }
  #sel { display: none; }
  .matchsec { position: fixed; z-index: 10; left: 8px; right: 8px; bottom: 8px; background: #fafaf8; border-radius: 12px; padding: 10px; box-shadow: 0 8px 30px #0005; }
  #chip { flex-direction: row; flex-wrap: wrap; } #chip .head { width: 100%; } #chip [data-z] small { display: none; }
  #wrap { padding: 8px; }
}
</style>
</head>
<body>
<aside id="side">
  <div class="top"><h1><span class="logo"></span>Block colors</h1><p>Minecraft <span id="version"></span> · <span id="count"></span></p></div>
  <div class="ctrls">
    <section><h2>Face</h2><div id="views"></div></section>
    <section><h2>Layout</h2><div id="layouts"></div></section>
    <section class="gapsec">
      <div class="gaprow"><span class="gaplbl">Show gaps<button class="info" aria-expanded="false" aria-controls="gapsinfo" aria-label="What are gaps?">i</button></span>
        <button id="gaps" aria-label="Show gaps"><i></i></button></div>
      <p id="gapsinfo">Empty space where no block has the color</p></section>
  </div>
  <section class="matchsec"><h2>Matching</h2>
    <div id="chip"><div class="head"><div class="src"></div><div class="src-name"></div><button class="x">Clear</button></div>
      <button data-z="close"><span>Similar hue<small>Same hue ±30°, any lightness</small></span></button>
      <button data-z="neutral"><span>Neutrals<small>Grays, whites and blacks</small></span></button>
      <button data-z="accent"><span>Accent<small>The opposite hue</small></span></button></div>
  </section>
  <section id="sel"><h2>Selected</h2>
    <div class="empty">Click a block to inspect it</div>
    <div class="card"><div class="sw"></div><div class="name"></div><div class="hex"></div><button class="match">Find matching blocks</button></div>
  </section>
</aside>
<div id="wrap"><div id="map"></div></div>
<div id="tip"><div class="name"></div><div class="hex"></div><button class="match">Find matches</button></div>
<script>
const D = /*DATA*/null;
const VIEWS = Object.keys(D.views);
const LAYOUTS = ["reference", "wheel", "spectrum", "rows", "som"].filter(l => l in D.views.side.layouts);
let view = "side", layout = LAYOUTS[0], sel = null;
let gaps = false;
const hasGaps = () => layout + "-gaps" in D.views[view].layouts;
const ALL_ZONES = () => ({ close: true, neutral: true, accent: true });
let match = null, zones = ALL_ZONES();

document.head.insertAdjacentHTML("beforeend", "<style>" +
  D.tex.map((b, i) => `.t${i}{background-image:url(data:image/png;base64,${b})}`).join("") + "</style>");

const $ = s => document.querySelector(s);
$("#version").textContent = D.version;
const map = $("#map"), tip = $("#tip"), wrap = $("#wrap");
let tiles = [], tilesView = null;
function build() {
  map.replaceChildren();
  tiles = D.views[view].t.map((t, i) => {
    const e = document.createElement("div");
    e.dataset.i = i;
    e.className = "t" + t;
    map.appendChild(e);
    return e;
  });
  tilesView = view;
}

function buttons(id, items, set) {
  const el = document.getElementById(id);
  for (const it of items) {
    const btn = document.createElement("button");
    btn.textContent = it === "som" ? "SOM" : it;
    btn.dataset.v = it;
    btn.onclick = () => { set(it); draw(); };
    el.appendChild(btn);
  }
}
buttons("views", VIEWS, v => { if (v !== view) select(null); view = v; });
buttons("layouts", LAYOUTS, v => layout = v);
const gapsBtn = $("#gaps");
gapsBtn.onclick = () => { gaps = !gaps; draw(); };
$(".gaplbl").onclick = e => { if (!e.target.closest(".info")) gapsBtn.click(); };
$(".info").onclick = e => {
  const open = $("#gapsinfo").classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", open);
};

function draw() {
  const V = D.views[view], L = V.layouts[gaps && hasGaps() ? layout + "-gaps" : layout];
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  document.querySelectorAll("#layouts button").forEach(b => b.classList.toggle("on", b.dataset.v === layout));
  gapsBtn.disabled = !hasGaps();
  gapsBtn.classList.toggle("on", gaps && hasGaps());
  gapsBtn.setAttribute("aria-pressed", gaps && hasGaps());
  $("#count").textContent = V.t.length + " blocks";
  const fresh = tilesView !== view;
  if (fresh) build();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < L.length; i += 2) {
    x0 = Math.min(x0, L[i]); x1 = Math.max(x1, L[i]);
    y0 = Math.min(y0, L[i + 1]); y1 = Math.max(y1, L[i + 1]);
  }
  const cols = x1 - x0 + 1, rows = y1 - y0 + 1;
  const cs = getComputedStyle(wrap);
  const w = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  // phones: fit the width and scroll; wide screens: fit the whole map
  const cell = Math.max(8, Math.floor(w < 700 ? w / cols : Math.min(w / cols, h / rows)));
  map.style.width = cols * cell + "px";
  map.style.height = rows * cell + "px";
  tiles.forEach((e, i) => {
    if (fresh) e.style.transition = "none";
    e.style.width = e.style.height = cell + "px";
    e.style.transform = `translate(${(L[2 * i] - x0) * cell}px,${(L[2 * i + 1] - y0) * cell}px)`;
  });
  map.style.setProperty("--cell", cell + "px");
  map.style.setProperty("--b", Math.max(1, Math.round(cell / 24)) + "px");
  map.style.setProperty("--m", Math.max(4, Math.round(cell / 5)) + "px");
  if (fresh) { map.offsetWidth; tiles.forEach(e => e.style.transition = ""); }
  if (fresh) applyMatch();
  if (sel !== null) setTimeout(pin, 520);
  writeHash();
}

function lch(L, a, b) {
  return [L, Math.hypot(a, b), (Math.atan2(b, a) * 180 / Math.PI + 360) % 360];
}

// OKLab (×1000) -> #rrggbb
function hex(L, a, b) {
  L /= 1000; a /= 1000; b /= 1000;
  const l = (L + .3963377774 * a + .2158037573 * b) ** 3, m = (L - .1055613458 * a - .0638541728 * b) ** 3,
        s = (L - .0894841775 * a - 1.291485548 * b) ** 3;
  const lin = [4.0767416621 * l - 3.3077115913 * m + .2309699292 * s,
               -1.2684380046 * l + 2.6097574011 * m - .3413193965 * s,
               -.0041960863 * l - .7034186147 * m + 1.707614701 * s];
  return "#" + lin.map(v => {
    v = Math.max(0, Math.min(1, v));
    v = v <= .0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - .055;
    return Math.round(v * 255).toString(16).padStart(2, "0");
  }).join("");
}
const hexOf = i => { const C = D.views[view].c; return hex(C[3 * i], C[3 * i + 1], C[3 * i + 2]); };

function applyMatch() {
  const chip = $("#chip");
  writeHash();
  map.classList.toggle("matching", !!match);
  document.body.classList.toggle("matching", !!match);
  if (!match) { tiles.forEach(e => e.classList.remove("on", "z-close", "z-neutral", "z-accent", "z-src")); return; }
  chip.querySelector(".src").className = "src t" + match.t;
  if (chip.querySelector(".src-name")) chip.querySelector(".src-name").textContent = match.n || "";
  chip.querySelectorAll("[data-z]").forEach(b => { b.classList.toggle("on", zones[b.dataset.z]); b.setAttribute("aria-pressed", zones[b.dataset.z]); });
  const [, sC, sH] = lch(...match.c), G = D.gray * 1000, C = D.views[view].c;
  tiles.forEach((e, i) => {
    const [, c, h] = lch(C[3 * i], C[3 * i + 1], C[3 * i + 2]);
    const dh = Math.abs(((h - sH) % 360 + 540) % 360 - 180);
    let z = null;
    if (c < G) z = sC < G && zones.close ? "close" : "neutral";
    else if (sC >= G && dh <= 30) z = "close";
    else if (sC >= G && dh >= 150) z = "accent";
    const src = D.views[view].t[i] === match.t;
    const on = src || (z !== null && zones[z]);
    e.classList.toggle("on", on);
    e.classList.toggle("z-src", src);
    for (const k of ["close", "neutral", "accent"]) e.classList.toggle("z-" + k, on && !src && z === k);
  });
}

// the matched tile is kept with its view and index, so the url can point back to it
function matchOf(v, i) {
  const V = D.views[v];
  return { v, i, t: V.t[i], c: V.c.slice(3 * i, 3 * i + 3), n: V.n[i] };
}

function startMatch() {
  match = matchOf(view, sel);
  zones = ALL_ZONES();
  select(null);
  applyMatch();
}
document.querySelectorAll("button.match").forEach(b => b.onclick = startMatch);
document.querySelectorAll("#chip [data-z]").forEach(b => b.onclick = () => { zones[b.dataset.z] = !zones[b.dataset.z]; applyMatch(); });
$("#chip .x").onclick = () => { match = null; applyMatch(); };

function fill(root, i) {
  if (!root) return;
  const set = (s, f) => root.querySelectorAll(s).forEach(f);
  set(".name", e => e.textContent = D.views[view].n[i]);
  set(".hex", e => e.textContent = hexOf(i));
  set(".sw", e => e.className = "sw t" + D.views[view].t[i]);
}

function show(i, x, y) {
  fill(tip, i);
  tip.style.display = "block";
  tip.style.left = Math.max(4, Math.min(x, innerWidth - tip.offsetWidth - 4)) + "px";
  tip.style.top = Math.max(4, Math.min(y, innerHeight - tip.offsetHeight - 4)) + "px";
}

function pin() {
  if (sel === null) return;
  const r = tiles[sel].getBoundingClientRect();
  show(sel, 0, 0);
  const above = r.top - tip.offsetHeight - 8;
  tip.classList.toggle("below", above < 4);
  show(sel, r.left + r.width / 2 - tip.offsetWidth / 2, above < 4 ? r.bottom + 8 : above);
}

function select(i) {
  if (sel !== null) tiles[sel].classList.remove("sel");
  sel = i;
  tip.classList.toggle("pinned", sel !== null);
  writeHash();
  document.body.classList.toggle("selecting", sel !== null);
  if (sel === null) { tip.style.display = "none"; return; }
  tiles[sel].classList.add("sel");
  fill($("#sel"), sel);
  pin();
}

map.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse" || sel !== null) return;
  const i = e.target.dataset.i;
  if (i === undefined) tip.style.display = "none";
  else show(+i, e.clientX + 14, e.clientY + 16);
});
map.addEventListener("pointerleave", () => { if (sel === null) tip.style.display = "none"; });
document.addEventListener("click", e => {
  const i = e.target.dataset ? e.target.dataset.i : undefined;
  if (i !== undefined) select(+i === sel ? null : +i);
  else if (!e.target.closest("#bar, #tip, #chip, #sel, #side, nav")) select(null);
});
addEventListener("keydown", e => { if (e.key === "Escape") select(null); });
addEventListener("scroll", pin, { passive: true });
wrap.addEventListener("scroll", pin, { passive: true });
addEventListener("resize", draw);

// the whole state lives in the url hash (#view=top&layout=wheel&gaps=1&match=side.12&zones=close,accent&sel=40),
// so reloading or sharing the link reopens the same map. Defaults are left out.
function writeHash() {
  const q = [];
  if (view !== "side") q.push("view=" + view);
  if (layout !== LAYOUTS[0]) q.push("layout=" + layout);
  if (gaps) q.push("gaps=1");
  if (match) q.push("match=" + match.v + "." + match.i);
  if (match && !Object.values(zones).every(Boolean)) q.push("zones=" + Object.keys(zones).filter(k => zones[k]).join(","));
  if (sel !== null) q.push("sel=" + sel);
  history.replaceState(null, "", q.length ? "#" + q.join("&") : location.pathname + location.search);
}

function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  const tile = (v, i) => v in D.views && /^\d+$/.test(i) && +i < D.views[v].t.length;
  view = VIEWS.includes(q.get("view")) ? q.get("view") : "side";
  layout = LAYOUTS.includes(q.get("layout")) ? q.get("layout") : LAYOUTS[0];
  gaps = q.get("gaps") === "1";
  const [mv, mi] = (q.get("match") || "").split(".");
  match = tile(mv, mi) ? matchOf(mv, +mi) : null;
  zones = ALL_ZONES();
  if (q.has("zones")) for (const k in zones) zones[k] = q.get("zones").split(",").includes(k);
  return tile(view, q.get("sel")) ? +q.get("sel") : null;
}

function load() {
  if (sel !== null) tiles[sel].classList.remove("sel");
  sel = null;
  const s = readHash();
  draw();
  applyMatch();
  select(s);
}
addEventListener("hashchange", load);
load();
</script>
</body>
</html>
